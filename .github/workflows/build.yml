                  @JavascriptInterface
                  public String waSend(String phone, String text) {
                      if (!JarvisAccessibility.enabled()) return "sem_acessibilidade";
                      try {
                          String url = "https://wa.me/" + phone.replaceAll("[^0-9]", "") + "?text=" + Uri.encode(text);
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          JarvisAccessibility.arm();
                          try {
                              i.setPackage("com.whatsapp");
                              startActivity(i);
                          } catch (Exception e) {
                              i.setPackage(null);
                              startActivity(i);
                          }
                          ui.postDelayed(() -> {
                              if (JarvisAccessibility.isArmed() || JarvisAccessibility.armedUntil != 0) {
                                  JarvisAccessibility.disarm();
                                  js("jvNative.onWaSent(false)");
                              }
                          }, 16000);
                          return "ok";
                      } catch (Exception e) {
                          JarvisAccessibility.disarm();
                          return "erro";
                      }
                  }

