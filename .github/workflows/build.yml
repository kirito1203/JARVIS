              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  boolean ok = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  if (requestCode == REQ_MIC) {
                      if (ok && listenAfterPermission) startListening();
                      else if (!ok) js("jvNative.onListenError('perm')");
                      listenAfterPermission = false;
                  } else if (requestCode == REQ_WAKE) {
                      if (ok) startWakeService();
                      else js("jvNative.onListenError('perm')");
                  }
              }

              /* ---------------- microfone ---------------- */
              void startListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      listenAfterPermission = true;
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("jvNative.onListenError('unavailable')");
                      return;
                  }
                  final boolean micWasHeld = WakeService.micHeld();
                  WakeService.pauseNow();
                  if (tts != null) tts.stop();
                  // um pedido de escuta por vez: este numero invalida qualquer inicio antigo que ainda esteja na fila
                  final int seq = ++listenSeq;
                  listenPending = true;
                  listenStartedAt = System.currentTimeMillis();
                  WakeService.lastListenAt = listenStartedAt;
                  // O servico de voz so atende um pedido por vez: solta o do modo segundo plano e
                  // REAPROVEITA o mesmo reconhecedor (criar um novo a cada vez deixava ele "ocupado").
                  WakeService.cancelBgListen();
                  boolean fresh = false;
                  if (recognizer != null && recMadeIdx != recIdx) {
                      try { recognizer.destroy(); } catch (Exception ignored) { }
                      recognizer = null;
                  }
                  if (recognizer == null) {
                      recognizer = createRecognizer(this);
                      recMadeIdx = recIdx;
                      fresh = true;
                  } else {
                      try { recognizer.cancel(); } catch (Exception ignored) { }
                  }
                  final int startDelay = micWasHeld ? 450 : (fresh ? 250 : 150);
                  recognizer.setRecognitionListener(new RecognitionListener() {
                      @Override public void onReadyForSpeech(Bundle params) { listenPending = false; nativeListening = true; ui.removeCallbacks(ghostClose); js("jvNative.onListenStart()"); }
                      @Override public void onBeginningOfSpeech() { }
                      @Override public void onRmsChanged(float rmsdB) { }
                      @Override public void onBufferReceived(byte[] buffer) { }
                      @Override public void onEndOfSpeech() { }

                      @Override
                      public void onError(final int error) {
                          nativeListening = false;
                          listenPending = false;
                          errChain = errChain + (errChain.isEmpty() ? "" : ", ") + recLabel + ":" + error;
                          if (error == 6 || error == 7) markGood(MainActivity.this);   // o servico funcionou, so nao ouviu fala
                          int maxTry = Math.min(5, candidateCount(MainActivity.this) + 1);
                          if (listenTry < maxTry && retryable(error)) {
                              // tenta de novo sozinho, trocando para o proximo servico de voz do celular
                              listenTry++;
                              try { if (recognizer != null) recognizer.cancel(); } catch (Exception ignored) { }
                              if (error != 3) recIdx++;
                              ui.postDelayed(new Runnable() { public void run() { startListening(); } }, error == 3 ? 800 : 450);
                              return;
                          }
                          if (error != 6 && error != 7) {
                              try { if (recognizer != null) recognizer.destroy(); } catch (Exception ignored) { }
                              recognizer = null;
                              if (!ghostMode) {
                                  // nenhum servico funcionou: mostra os erros e, em ultimo caso, abre a janela de voz do Google
                                  micReport = "FALHOU: " + errChain;
                                  js("jvNative.onToast(" + JSONObject.quote("Erros do microfone: " + errChain + ".") + ")");
                                  if (speechDialog()) return;
                              }
                          }
                          js("jvNative.onListenFail&&jvNative.onListenFail(" + error + ")");
                          js("jvNative.onListenEnd('')");
                          WakeService.resumeAll();
                          if (ghostMode) { ui.removeCallbacks(ghostClose); ui.postDelayed(ghostClose, 1600); }
                      }

                      @Override
                      public void onResults(Bundle results) {
                          nativeListening = false;
                          listenPending = false;
                          markGood(MainActivity.this);
                          micReport = "OK pelo servico " + recLabel + (errChain.isEmpty() ? "" : " (antes: " + errChain + ")");
                          js("jvNative.onListenEnd(" + JSONObject.quote(first(results)) + ")");
                          WakeService.resumeAll();
                      }

                      @Override
                      public void onPartialResults(Bundle partialResults) {
                          js("jvNative.onPartial(" + JSONObject.quote(first(partialResults)) + ")");
                      }

                      @Override public void onEvent(int eventType, Bundle params) { }
                  });
                  Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR");
                  it.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  final SpeechRecognizer r0 = recognizer;
                  final Intent it0 = it;
                  // da um instante para a escuta do nome soltar o microfone antes de comecar a ouvir
                  ui.postDelayed(new Runnable() {
                      public void run() {
                          try {
                              if (seq == listenSeq && r0 == recognizer) r0.startListening(it0);
                          } catch (Exception e) {
                              listenPending = false;
                              js("jvNative.onListenFail&&jvNative.onListenFail(5)");
                              js("jvNative.onListenEnd('')");
                              WakeService.resumeAll();
                          }
                      }
                  }, startDelay);
              }

              /* ---------- TV por infravermelho ---------- */
              // Cada código é um "power" (liga/desliga) no protocolo NEC. lead = pulso/pausa inicial.
              static final String[] TV_NAMES = {
                  "Samsung", "LG", "Toshiba/Semp/AOC",
                  "Genérico 1", "Genérico 2", "Genérico 3", "Genérico 4",
                  "Genérico 5", "Genérico 6", "Genérico 7", "Genérico 8"
              };
              static final int[] TV_LEADH  = {4500, 9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000, 9000};
              static final int[] TV_LEADL  = {4500, 4500, 4500, 4500, 4500, 4500, 4500, 4500, 4500, 4500, 4500};
              static final long[] TV_DATA  = {
                  0xE0E040BFL, // Samsung power
                  0x20DF10EFL, // LG power
                  0x02FD48B7L, // Toshiba/Semp/AOC power
                  0x00FF08F7L, 0x04FB08F7L, 0x40BF08F7L, 0x08F708F7L, // cmd 0x08 (power comum), vários endereços
                  0x00FF02FDL, 0x40BF02FDL, 0x807F02FDL, 0x10EF08F7L  // cmd 0x02 / outros
              };

              static byte[] parseMac(String m) {
                  if (m == null) return null;
                  String[] p = m.trim().split("[:\\-]");
                  if (p.length != 6) return null;
                  byte[] b = new byte[6];
                  try {
                      for (int i = 0; i < 6; i++) b[i] = (byte) Integer.parseInt(p[i], 16);
                  } catch (Exception e) {
                      return null;
                  }
                  return b;
              }

              static void sendWol(final byte[] mac) {
                  new Thread(() -> {
                      try {
                          byte[] pkt = new byte[6 + 16 * 6];
                          for (int i = 0; i < 6; i++) pkt[i] = (byte) 0xFF;
                          for (int i = 6; i < pkt.length; i += 6) System.arraycopy(mac, 0, pkt, i, 6);
                          DatagramSocket s = new DatagramSocket();
                          s.setBroadcast(true);
                          InetAddress bcast = InetAddress.getByName("255.255.255.255");
                          for (int port : new int[]{9, 7}) {
                              try { s.send(new DatagramPacket(pkt, pkt.length, bcast, port)); } catch (Exception ignored) {}
                          }
                          s.close();
                      } catch (Exception ignored) { }
                  }).start();
              }

              static int[] necPattern(int leadH, int leadL, long data) {
                  int[] p = new int[2 + 64 + 1];
                  int i = 0;
                  p[i++] = leadH;
                  p[i++] = leadL;
                  for (int b = 31; b >= 0; b--) {
                      p[i++] = 560;
                      p[i++] = ((data >> b) & 1L) == 1L ? 1690 : 560;
                  }
                  p[i++] = 560;
                  return p;
              }

              boolean irHasEmitter() {
                  try {
                      ConsumerIrManager m = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                      return m != null && m.hasIrEmitter();
                  } catch (Exception e) {
                      return false;
                  }
              }

              String irTransmit(int idx) {
                  try {
                      ConsumerIrManager m = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                      if (m == null || !m.hasIrEmitter()) return "sem_ir";
                      if (idx < 0 || idx >= TV_DATA.length) return "indice";
                      m.transmit(38000, necPattern(TV_LEADH[idx], TV_LEADL[idx], TV_DATA[idx]));
                      return "ok";
                  } catch (Exception e) {
                      return "erro";
                  }
              }

