                  // o estalo acabou
                  inBurst = false;
                  boolean isClap = burstFrames <= 9;      // ate ~180 ms
                  if (!isClap) {
                      firstClap = 0;
                      return;
                  }
                  if (firstClap != 0 && burstStart - firstClap >= 180 && burstStart - firstClap <= 800) {
                      firstClap = 0;
                      svc.h.post(new Runnable() { public void run() { svc.clapWake(); } });
                  } else {
                      firstClap = burstStart;
                  }
              }
          }
