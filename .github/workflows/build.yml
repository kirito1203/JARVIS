                          JSONObject granted = null;
                          int sc = 0;
                          for (int i = 0; i < req.length; i++) {
                              boolean isGranted = pi.requestedPermissionsFlags != null
                                      && (pi.requestedPermissionsFlags[i] & PackageInfo.REQUESTED_PERMISSION_GRANTED) != 0;
                              if (!isGranted) continue;
                              for (String[] sp : SENSITIVE) {
                                  if (sp[0].equals(req[i])) {
                                      counts.put(sp[1], counts.optInt(sp[1]) + 1);
                                      sc++;
                                      if (granted == null) granted = new JSONObject();
                                      granted.put(sp[1], true);
