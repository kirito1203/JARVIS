          package com.kirito.jarvis;

          import android.app.Notification;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayDeque;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;

          /** Guarda as últimas notificações para o Jarvis ler. Também libera o acesso às músicas tocando. */
          public class NotifService extends NotificationListenerService {

              static final int MAX = 60;
              static final ArrayDeque<JSONObject> recent = new ArrayDeque<>();
              /** Botão "Responder" de cada notificação, para o Jarvis responder mensagens. */
              static final Map<String, Notification.Action> replies = new HashMap<>();

              @Override
              public void onListenerConnected() {
                  super.onListenerConnected();
                  try {
                      StatusBarNotification[] active = getActiveNotifications();
                      if (active != null) {
                          for (StatusBarNotification sbn : active) add(sbn);
                      }
                  } catch (Exception ignored) { }
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  add(sbn);
              }

              void add(StatusBarNotification sbn) {
                  try {
                      if (sbn == null || getPackageName().equals(sbn.getPackageName())) return;
                      Notification n = sbn.getNotification();
                      if (n == null) return;
                      if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                      if ((n.flags & Notification.FLAG_ONGOING_EVENT) != 0) return;
                      Bundle ex = n.extras;
                      if (ex == null) return;
                      CharSequence title = ex.getCharSequence(Notification.EXTRA_TITLE);
                      CharSequence text = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                      if (text == null) text = ex.getCharSequence(Notification.EXTRA_TEXT);
                      if (title == null && text == null) return;

                      String app = sbn.getPackageName();
                      try {
                          PackageManager pm = getPackageManager();
                          ApplicationInfo ai = pm.getApplicationInfo(app, 0);
                          app = pm.getApplicationLabel(ai).toString();
                      } catch (Exception ignored) { }

                      JSONObject o = new JSONObject();
                      o.put("app", app);
                      o.put("titulo", title == null ? "" : title.toString());
                      o.put("texto", text == null ? "" : text.toString());
                      o.put("quando", sbn.getPostTime());
                      String key = sbn.getKey();
                      o.put("key", key == null ? "" : key);
                      Notification.Action reply = findReply(n);
                      o.put("pode_responder", reply != null);

                      synchronized (recent) {
                          Iterator<JSONObject> it = recent.iterator();
                          while (it.hasNext()) {
                              if (it.next().optString("key").equals(o.optString("key"))) it.remove();
                          }
                          recent.addFirst(o);
                          while (recent.size() > MAX) {
                              JSONObject old = recent.removeLast();
                              replies.remove(old.optString("key"));
                          }
                          if (reply != null) replies.put(o.optString("key"), reply);
                          else replies.remove(o.optString("key"));
                      }
                  } catch (Exception ignored) { }
              }

              static Notification.Action findReply(Notification n) {
                  if (n.actions == null) return null;
                  for (Notification.Action a : n.actions) {
                      RemoteInput[] ins = a.getRemoteInputs();
                      if (ins != null && ins.length > 0 && a.actionIntent != null) return a;
                  }
                  return null;
              }

              /** Responde a notificação usando o botão "Responder" do próprio app (WhatsApp, Telegram, SMS...). */
              static String reply(Context ctx, String key, String text) {
                  Notification.Action a;
                  synchronized (recent) {
                      a = replies.get(key);
                  }
                  if (a == null) return "sem_resposta";
                  try {
                      Intent fill = new Intent();
                      Bundle results = new Bundle();
                      for (RemoteInput ri : a.getRemoteInputs()) results.putCharSequence(ri.getResultKey(), text);
                      RemoteInput.addResultsToIntent(a.getRemoteInputs(), fill, results);
                      a.actionIntent.send(ctx, 0, fill);
                      return "ok";
                  } catch (Exception e) {
                      return "erro";
                  }
              }

              static String dump() {
                  JSONArray arr = new JSONArray();
                  synchronized (recent) {
                      for (JSONObject o : recent) arr.put(o);
                  }
                  return arr.toString();
              }
          }
