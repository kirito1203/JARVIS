# Receita do app Android do J.A.R.V.I.S. (versão 1.8)
# O GitHub monta o APK sozinho sempre que este arquivo muda.
name: Construir Jarvis APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar o projeto Android
        run: |
          mkdir -p jarvis/app/src/main/assets jarvis/app jarvis/app/src/main jarvis/app/src/main/java/com/kirito/jarvis jarvis/app/src/main/res/drawable jarvis/app/src/main/res/layout jarvis/app/src/main/res/values jarvis/app/src/main/res/xml
          cd jarvis
          cat > settings.gradle <<'JARVIS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include ':app'
          JARVIS_EOF
          cat > build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          JARVIS_EOF
          cat > gradle.properties <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          JARVIS_EOF
          cat > app/build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kirito.jarvis'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.kirito.jarvis'
                  minSdk 26
                  targetSdk 34
                  versionCode 21
                  versionName '2.10'
              }

              signingConfigs {
                  jarvis {
                      storeFile file('jarvis.keystore')
                      storePassword 'jarvis123'
                      keyAlias 'jarvis'
                      keyPassword 'jarvis123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.jarvis
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.jarvis
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
              implementation 'com.alphacephei:vosk-android:0.3.47@aar'
          }
          JARVIS_EOF
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
