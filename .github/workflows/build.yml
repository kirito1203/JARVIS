          cat > app/src/main/java/com/kirito/jarvis/NotifService.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.app.Notification;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayDeque;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;

          /** Guarda as últimas notificações para o Jarvis ler. Também libera o acesso às músicas tocando. */
          public class NotifService extends NotificationListenerService {

              static final int MAX = 60;
              static final ArrayDeque<JSONObject> recent = new ArrayDeque<>();
              /** Botão "Responder" de cada notificação, para o Jarvis responder mensagens. */
              static final Map<String, Notification.Action> replies = new HashMap<>();

              @Override
              public void onListenerConnected() {
                  super.onListenerConnected();
                  try {
                      StatusBarNotification[] active = getActiveNotifications();
                      if (active != null) {
                          for (StatusBarNotification sbn : active) add(sbn);
                      }
                  } catch (Exception ignored) { }
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  add(sbn);
              }

              void add(StatusBarNotification sbn) {
                  try {
                      if (sbn == null || getPackageName().equals(sbn.getPackageName())) return;
                      Notification n = sbn.getNotification();
                      if (n == null) return;
                      if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                      if ((n.flags & Notification.FLAG_ONGOING_EVENT) != 0) return;
                      Bundle ex = n.extras;
                      if (ex == null) return;
                      CharSequence title = ex.getCharSequence(Notification.EXTRA_TITLE);
                      CharSequence text = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                      if (text == null) text = ex.getCharSequence(Notification.EXTRA_TEXT);
                      if (title == null && text == null) return;

                      String app = sbn.getPackageName();
                      try {
                          PackageManager pm = getPackageManager();
                          ApplicationInfo ai = pm.getApplicationInfo(app, 0);
                          app = pm.getApplicationLabel(ai).toString();
                      } catch (Exception ignored) { }

                      JSONObject o = new JSONObject();
                      o.put("app", app);
                      o.put("titulo", title == null ? "" : title.toString());
                      o.put("texto", text == null ? "" : text.toString());
                      o.put("quando", sbn.getPostTime());
                      String key = sbn.getKey();
                      o.put("key", key == null ? "" : key);
                      Notification.Action reply = findReply(n);
                      o.put("pode_responder", reply != null);

                      synchronized (recent) {
                          Iterator<JSONObject> it = recent.iterator();
                          while (it.hasNext()) {
                              if (it.next().optString("key").equals(o.optString("key"))) it.remove();
                          }
                          recent.addFirst(o);
                          while (recent.size() > MAX) {
                              JSONObject old = recent.removeLast();
                              replies.remove(old.optString("key"));
                          }
                          if (reply != null) replies.put(o.optString("key"), reply);
                          else replies.remove(o.optString("key"));
                      }
                  } catch (Exception ignored) { }
              }

              static Notification.Action findReply(Notification n) {
                  if (n.actions == null) return null;
                  for (Notification.Action a : n.actions) {
                      RemoteInput[] ins = a.getRemoteInputs();
                      if (ins != null && ins.length > 0 && a.actionIntent != null) return a;
                  }
                  return null;
              }

              /** Responde a notificação usando o botão "Responder" do próprio app (WhatsApp, Telegram, SMS...). */
              static String reply(Context ctx, String key, String text) {
                  Notification.Action a;
                  synchronized (recent) {
                      a = replies.get(key);
                  }
                  if (a == null) return "sem_resposta";
                  try {
                      Intent fill = new Intent();
                      Bundle results = new Bundle();
                      for (RemoteInput ri : a.getRemoteInputs()) results.putCharSequence(ri.getResultKey(), text);
                      RemoteInput.addResultsToIntent(a.getRemoteInputs(), fill, results);
                      a.actionIntent.send(ctx, 0, fill);
                      return "ok";
                  } catch (Exception e) {
                      return "erro";
                  }
              }

              static String dump() {
                  JSONArray arr = new JSONArray();
                  synchronized (recent) {
                      for (JSONObject o : recent) arr.put(o);
                  }
                  return arr.toString();
              }
          }
          JARVIS_EOF
          cat > app/src/main/java/com/kirito/jarvis/WakeService.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.Settings;

          import org.json.JSONObject;
          import org.vosk.LibVosk;
          import org.vosk.LogLevel;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.android.RecognitionListener;
          import org.vosk.android.SpeechService;
          import org.vosk.android.StorageService;

          /**
           * Fica ouvindo só a palavra "Jarvis", OFFLINE, dentro do celular (Vosk).
           * Não manda áudio pra internet e não pega o "foco de áudio", então não pausa a música.
           */
          public class WakeService extends Service implements RecognitionListener {

              static volatile WakeService inst;
              static volatile boolean running = false;

              /** Palavras parecidas com "Jarvis" que o modelo em português pode conhecer. */
              static final String GRAMMAR = "[\"jarvis\", \"jarbas\", \"jarves\", \"javis\", \"jarvas\", \"[unk]\"]";

              final Handler h = new Handler(Looper.getMainLooper());
              Model model;
              SpeechService speech;
              boolean paused = false;
              long lastTrigger = 0;
              final Runnable resumeRunnable = this::resume;

              static void pauseAll() {
                  WakeService s = inst;
                  if (s != null) s.h.post(s::pause);
              }

              /** Chamar só na thread principal. */
              static void pauseNow() {
                  WakeService s = inst;
                  if (s != null) s.pause();
              }

              static void resumeAll() {
                  WakeService s = inst;
                  if (s != null) {
                      s.h.removeCallbacks(s.resumeRunnable);
                      s.h.postDelayed(s.resumeRunnable, 700);
                  }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  inst = this;
                  running = true;
                  try { LibVosk.setLogLevel(LogLevel.WARNINGS); } catch (Throwable ignored) { }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("wake", "Escuta do Jarvis", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent open = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "wake")
                          .setContentTitle("J.A.R.V.I.S. em espera")
                          .setContentText("Diga \"Jarvis\" para me chamar (detector offline)")
                          .setSmallIcon(R.drawable.ic_jarvis)
                          .setContentIntent(open)
                          .setOngoing(true)
                          .build();
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                      } else {
                          startForeground(1, n);
                      }
                  } catch (Exception e) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (model == null) loadModel();
                  else if (speech == null && !paused) startListening();
                  return START_STICKY;
              }

              void loadModel() {
                  StorageService.unpack(this, "model-pt", "model",
                          m -> {
                              model = m;
                              if (!paused) startListening();
                          },
                          e -> toast("Não consegui carregar o detector de voz offline."));
              }

              void startListening() {
                  if (model == null || paused || speech != null) return;
                  try {
                      Recognizer rec = new Recognizer(model, 16000.0f, GRAMMAR);
                      speech = new SpeechService(rec, 16000.0f);
                      speech.startListening(this);
                  } catch (Exception e) {
                      speech = null;
                      h.postDelayed(this::startListening, 3000);
                  }
              }

              void stopListening() {
                  if (speech != null) {
                      try {
                          speech.stop();
                          speech.shutdown();
                      } catch (Exception ignored) { }
                      speech = null;
                  }
              }

              void pause() {
                  paused = true;
                  h.removeCallbacks(resumeRunnable);
                  stopListening();
              }

              void resume() {
                  if (!paused) return;
                  paused = false;
                  startListening();
              }

              /* ---------- RecognitionListener (Vosk) ---------- */
              @Override
              public void onPartialResult(String hypothesis) {
                  check(hypothesis, "partial");
              }

              @Override
              public void onResult(String hypothesis) {
                  check(hypothesis, "text");
              }

              @Override
              public void onFinalResult(String hypothesis) {
                  check(hypothesis, "text");
              }

              @Override
              public void onError(Exception e) {
                  stopListening();
                  if (!paused) h.postDelayed(this::startListening, 2000);
              }

              @Override
              public void onTimeout() {
                  stopListening();
                  if (!paused) h.postDelayed(this::startListening, 500);
              }

              void check(String json, String field) {
                  if (json == null || paused) return;
                  String t;
                  try {
                      t = new JSONObject(json).optString(field, "");
                  } catch (Exception e) {
                      return;
                  }
                  t = t.toLowerCase();
                  if (t.isEmpty()) return;
                  if (t.contains("jarvis") || t.contains("jarbas") || t.contains("jarves") || t.contains("javis") || t.contains("jarvas")) {
                      long now = System.currentTimeMillis();
                      if (now - lastTrigger < 3000) return;
                      lastTrigger = now;
                      h.post(() -> trigger("__WAKE__"));
                  }
              }

              void trigger(String cmd) {
                  pause();
                  Intent i = new Intent(this, MainActivity.class);
                  i.putExtra("cmd", cmd);
                  i.putExtra("mini", true);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  boolean visible = MainActivity.current != null && MainActivity.current.hasWindowFocus();
                  try {
                      startActivity(i);
                  } catch (Exception ignored) { }
                  if (!visible && !Settings.canDrawOverlays(this)) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("call", "Chamadas do Jarvis", NotificationManager.IMPORTANCE_HIGH));
                      PendingIntent pi = PendingIntent.getActivity(this, 2, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification n = new Notification.Builder(this, "call")
                              .setContentTitle("J.A.R.V.I.S.")
                              .setContentText("Pois não? Toque para falar.")
                              .setSmallIcon(R.drawable.ic_jarvis)
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .build();
                      nm.notify(2, n);
                  }
                  // Segurança: volta a esperar o nome mesmo se ninguém responder.
                  h.removeCallbacks(resumeRunnable);
                  h.postDelayed(resumeRunnable, 20000);
              }

              void toast(String msg) {
                  MainActivity a = MainActivity.current;
                  if (a != null) a.js("jvNative.onToast(" + JSONObject.quote(msg) + ")");
              }

              @Override
              public void onDestroy() {
                  running = false;
                  paused = true;
                  stopListening();
                  h.removeCallbacksAndMessages(null);
                  if (model != null) {
                      try { model.close(); } catch (Exception ignored) { }
                      model = null;
                  }
                  if (inst == this) inst = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          JARVIS_EOF
          echo '' | base64 -d > app/jarvis.keystore

      - name: Baixar o detector de voz offline (Vosk, português)
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q model.zip -d model_tmp
          DIR=$(find model_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$DIR" jarvis/app/src/main/assets/model-pt
          date +%s > jarvis/app/src/main/assets/model-pt/uuid
          echo "Palavras parecidas com Jarvis que o modelo conhece:"
          WORDS=$(find jarvis/app/src/main/assets/model-pt -name words.txt | head -n 1)
          for w in jarvis jarbas jarves javis jarvas; do
            if [ -n "$WORDS" ] && grep -q "^$w " "$WORDS"; then echo "  $w: sim"; else echo "  $w: nao"; fi
          done
          du -sh jarvis/app/src/main/assets/model-pt

      - name: Montar o APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp jarvis/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Jarvis App v${{ github.run_number }}
          body: "Versão 1.5: Jarvis liga a TV pelo infravermelho (vira controle remoto). Baixe o Jarvis.apk abaixo e instale por cima."
          files: Jarvis.apk
          make_latest: true
