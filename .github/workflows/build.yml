                          if ("BR".equals(country)) sc += 40;
                          if (n.contains("male") && !n.contains("female")) sc += 30;
                          if (n.contains("female")) sc -= 15;
                          sc += Math.max(0, Math.min(10, v.getQuality() / 50));   // qualidade (100..500) -> 0..10
                          if (!v.isNetworkConnectionRequired()) sc += 6;          // funciona offline, mais confiavel
                          if (n.contains("-local")) sc += 3;
                          if (sc > bestScore) { bestScore = sc; best = v; }
                      }
