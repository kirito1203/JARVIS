          package com.kirito.jarvis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Mostra o alarme/lembrete mesmo com o app fechado. */
          public class AlarmReceiver extends BroadcastReceiver {

              static PendingIntent pending(Context ctx, String id, String text, boolean onlyExisting) {
                  Intent i = new Intent(ctx, AlarmReceiver.class);
                  i.setAction("com.kirito.jarvis.ALARM." + id);
                  i.putExtra("text", text);
                  int flags = PendingIntent.FLAG_IMMUTABLE | (onlyExisting ? PendingIntent.FLAG_NO_CREATE : PendingIntent.FLAG_UPDATE_CURRENT);
                  return PendingIntent.getBroadcast(ctx, id.hashCode(), i, flags);
              }

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  String text = intent.getStringExtra("text");
                  if (text == null || text.isEmpty()) text = "Lembrete";
                  if (text.startsWith("__CMD__")) {
                      try { WakeService.runCommand(text.substring(7)); } catch (Throwable t) { }
                      return;
                  }
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  NotificationChannel ch = new NotificationChannel("alarms", "Alarmes do Jarvis", NotificationManager.IMPORTANCE_HIGH);
                  ch.enableVibration(true);
                  ch.setVibrationPattern(new long[]{0, 400, 150, 400, 150, 800});
                  nm.createNotificationChannel(ch);
                  PendingIntent open = PendingIntent.getActivity(ctx, 1, new Intent(ctx, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(ctx, "alarms")
                          .setSmallIcon(R.drawable.ic_jarvis)
                          .setContentTitle("J.A.R.V.I.S.")
                          .setContentText(text)
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setAutoCancel(true)
                          .setContentIntent(open)
                          .build();
                  nm.notify((int) (System.currentTimeMillis() % 100000), n);
                  try { WakeService.announce("Lembrete, senhor: " + text); } catch (Throwable t) { }
              }
          }
          JARVIS_EOF
          cat > app/src/main/java/com/kirito/jarvis/JarvisAccessibility.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.List;

          /**
           * Aperta o botão "Enviar" do WhatsApp por você, só quando o Jarvis pede
           * (depois da sua confirmação). Não lê nem guarda nada das suas conversas.
           */
          public class JarvisAccessibility extends AccessibilityService {

              static volatile JarvisAccessibility inst;
              static volatile long armedUntil = 0;
              static volatile String lastScreen = "";
              static volatile String lastApp = "";
              static volatile long lastScreenTime = 0;

              static final String[] SEND_IDS = {"com.whatsapp:id/send", "com.whatsapp.w4b:id/send"};
              static final String[] SEND_LABELS = {"Enviar", "Send"};

              final Handler h = new Handler(Looper.getMainLooper());

              static boolean enabled() { return inst != null; }

              static void arm() { armedUntil = System.currentTimeMillis() + 15000; }

              static boolean isArmed() { return armedUntil != 0 && System.currentTimeMillis() < armedUntil; }

              static void disarm() { armedUntil = 0; }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  inst = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  CharSequence pkgc = event.getPackageName();
                  String pkg = pkgc == null ? "" : pkgc.toString();
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      cacheScreen(pkg);
                  }
                  if (isArmed() && pkg.startsWith("com.whatsapp")) tryClick();
              }

              /** Guarda o texto da tela que o usuário está vendo, para o Jarvis poder ler quando pedir. */
              void cacheScreen(String pkg) {
                  if (pkg.isEmpty() || pkg.equals(getPackageName()) || pkg.contains("systemui")) return;
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return;
                      StringBuilder sb = new StringBuilder();
                      collect(root, sb, 0);
                      String t = sb.toString().trim();
                      if (t.length() < 15) return;
                      if (t.length() > 4000) t = t.substring(0, 4000);
                      lastScreen = t;
                      lastApp = pkg;
                      lastScreenTime = System.currentTimeMillis();
                  } catch (Exception ignored) { }
              }

              static void collect(AccessibilityNodeInfo n, StringBuilder sb, int depth) {
                  if (n == null || depth > 60 || sb.length() > 4200) return;
                  CharSequence tx = n.getText();
                  if (tx != null && tx.length() > 0) {
                      sb.append(tx).append('\n');
                  } else {
                      CharSequence cd = n.getContentDescription();
                      if (cd != null && cd.length() > 0 && cd.length() < 120) sb.append(cd).append('\n');
                  }
                  for (int i = 0; i < n.getChildCount(); i++) collect(n.getChild(i), sb, depth + 1);
              }

              static String screenJson() {
                  String t = lastScreen;
                  if (t == null) t = "";
                  long secs = lastScreenTime == 0 ? -1 : (System.currentTimeMillis() - lastScreenTime) / 1000;
                  try {
                      org.json.JSONObject o = new org.json.JSONObject();
                      o.put("app", lastApp == null ? "" : lastApp);
                      o.put("texto", t);
                      o.put("ha_segundos", secs);
                      return o.toString();
                  } catch (Exception e) {
                      return "{}";
                  }
              }

              void tryClick() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  AccessibilityNodeInfo btn = findSend(root);
                  if (btn == null) return;
                  AccessibilityNodeInfo c = btn;
                  while (c != null && !c.isClickable()) c = c.getParent();
                  if (c == null) return;
                  if (c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                      disarm();
                      h.postDelayed(() -> {
                          report(true);
                          Intent i = new Intent(this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                          try { startActivity(i); } catch (Exception ignored) { }
                      }, 800);
                  }
              }

              static AccessibilityNodeInfo findSend(AccessibilityNodeInfo root) {
                  for (String id : SEND_IDS) {
                      List<AccessibilityNodeInfo> l = root.findAccessibilityNodeInfosByViewId(id);
                      if (l != null && !l.isEmpty()) return l.get(0);
                  }
                  for (String label : SEND_LABELS) {
                      List<AccessibilityNodeInfo> l = root.findAccessibilityNodeInfosByText(label);
                      if (l == null) continue;
                      for (AccessibilityNodeInfo n : l) {
                          CharSequence d = n.getContentDescription();
                          if (d != null && d.toString().equalsIgnoreCase(label)) return n;
                      }
                  }
                  return null;
              }

              static void report(boolean ok) {
                  MainActivity a = MainActivity.current;
                  if (a != null) a.js("jvNative.onWaSent(" + ok + ")");
              }

              @Override
              public void onInterrupt() { }

              @Override
              public void onDestroy() {
                  if (inst == this) inst = null;
                  super.onDestroy();
              }
          }
          JARVIS_EOF
          cat > app/src/main/java/com/kirito/jarvis/JarvisRecognitionService.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.content.Intent;
          import android.speech.RecognitionService;
          import android.speech.SpeechRecognizer;

          /**
           * O Android exige que todo assistente tenha um "serviço de reconhecimento".
           * O Jarvis usa o do Google por dentro, então este aqui só recusa educadamente.
           */
