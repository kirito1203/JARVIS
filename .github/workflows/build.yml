                                  case KeyEvent.KEYCODE_MEDIA_NEXT: tc.skipToNext(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_PREVIOUS: tc.skipToPrevious(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_STOP: tc.stop(); return "ok";
                                  default: break;
