                          if (i < l.size()) {
                              ComponentName cn = l.get(i);
                              String p = cn.getPackageName();
                              recLabel = p.equals("com.google.android.tts") ? "voz-google" : (p.contains("quicksearchbox") ? "app-google" : p.substring(p.lastIndexOf('.') + 1));
                              recFull = cn.flattenToString();
                              return SpeechRecognizer.createSpeechRecognizer(c, cn);
                          }
                          if (Build.VERSION.SDK_INT >= 31) {
                              recLabel = "local";
                              recFull = "";
                              return SpeechRecognizer.createOnDeviceSpeechRecognizer(c);
                          }
                      }
                  } catch (Throwable ignored) { }
                  recLabel = "padrao";
                  recFull = "";
                  return SpeechRecognizer.createSpeechRecognizer(c);
              }

              /** Este servico funcionou: da proxima vez ele e o primeiro da fila. */
              static void markGood(Context c) {
                  try {
                      if (!recFull.isEmpty()) c.getSharedPreferences("jvprefs", Context.MODE_PRIVATE).edit().putString("recGood", recFull).apply();
                  } catch (Exception ignored) { }
              }

              /** Erros em que vale tentar de novo sozinho (microfone ocupado, servico ocupado, falha do servico). */
              static boolean retryable(int error) {
                  return error == 3 || error == 5 || error == 8 || error == 9 || error == 4 || error == 12 || error == 13 || error == 11 || error == 10;
              }

              int listenTry = 0;
              int recMadeIdx = -1;
              String errChain = "";
              static boolean preferDialog = false;
              static String micReport = "ainda nao usei o microfone";
              int listenSeq = 0;
              volatile long listenStartedAt = 0;
              volatile boolean listenPending = false;
              static final int REQ_SPEECH = 77;

              /** Plano B: a janelinha "Fale agora" do proprio Google. Usada quando o servico de voz falha. */
