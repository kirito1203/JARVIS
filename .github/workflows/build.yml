                  } else {
                      queuedCmd = text;
                      ensureWeb();
                      h.removeCallbacks(loadGuard);
                      h.postDelayed(loadGuard, 20000L);
                  }
              }

              void checkNews() {
                  try {
                      MainActivity a = MainActivity.current;
                      if (a != null) {
                          a.js("jvNative.bgNews&&jvNative.bgNews()");
                          return;
                      }
                      if (listening || !curId.isEmpty()) return;
                      if (pageReady && web != null) {
                          js("jvNative.bgNews&&jvNative.bgNews()");
                      } else {
                          queuedJs = "jvNative.bgNews&&jvNative.bgNews()";
                          ensureWeb();
                      }
                      touchIdle();
                  } catch (Exception ignored) { }
              }

              /* ---------------- pagina invisivel ---------------- */
              void ensureWeb() {
                  if (web != null) return;
                  pageReady = false;
                  pageFailed = false;
                  try {
                      web = new WebView(ctx);
                      WebSettings s = web.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setGeolocationEnabled(true);
                      web.addJavascriptInterface(new Bridge(), "Android");
                      web.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              h.postDelayed(new Runnable() { public void run() { pageLoaded(); } }, 700);
                          }

                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              if (request.isForMainFrame()) pageFailed = true;
                          }
                      });
                      web.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                              callback.invoke(origin, true, false);
                          }
                      });
                      web.loadUrl(MainActivity.SITE);
                  } catch (Exception e) {
                      web = null;
                      pageFailed = true;
                  }
              }

              void pageLoaded() {
                  if (web == null) return;
                  if (pageFailed) {
                      String c = queuedCmd;
                      queuedCmd = null;
                      queuedJs = null;
                      if (c != null) deliver(c);
                      else destroyWeb();
                      return;
                  }
                  pageReady = true;
                  if (queuedCmd != null) {
                      String c = queuedCmd;
                      queuedCmd = null;
                      js("jvNative.onCommand(" + JSONObject.quote(c) + ")");
                  }
                  if (queuedJs != null) {
                      String c = queuedJs;
                      queuedJs = null;
                      js(c);
                  }
              }

              void destroyWeb() {
                  h.removeCallbacks(idleKill);
                  if (listening || !curId.isEmpty()) {
                      touchIdle();
                      return;
                  }
                  pageReady = false;
                  if (web != null) {
                      try { web.destroy(); } catch (Exception ignored) { }
                      web = null;
                  }
              }

              void js(final String code) {
                  h.post(new Runnable() {
                      public void run() {
                          if (web != null) {
                              try { web.evaluateJavascript("try{" + code + "}catch(e){}", null); } catch (Exception ignored) { }
                          }
                      }
                  });
              }

              void destroy() {
                  h.removeCallbacksAndMessages(null);
                  try { if (rec != null) rec.destroy(); } catch (Exception ignored) { }
                  rec = null;
                  try { if (tts != null) tts.shutdown(); } catch (Exception ignored) { }
                  tts = null;
                  ttsReady = false;
                  if (web != null) {
                      try { web.destroy(); } catch (Exception ignored) { }
                      web = null;
                  }
              }

