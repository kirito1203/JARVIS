          cat > app/src/main/java/com/kirito/jarvis/WakeService.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.Settings;

          import org.json.JSONObject;
          import org.vosk.LibVosk;
          import org.vosk.LogLevel;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.android.RecognitionListener;
          import org.vosk.android.SpeechService;
          import org.vosk.android.StorageService;

          /**
           * Fica ouvindo só a palavra "Jarvis", OFFLINE, dentro do celular (Vosk).
           * Não manda áudio pra internet e não pega o "foco de áudio", então não pausa a música.
           */
          public class WakeService extends Service implements RecognitionListener {

              static volatile WakeService inst;
              static volatile boolean running = false;

              /** Palavras parecidas com "Jarvis" que o modelo em português pode conhecer. */
              static final String GRAMMAR = "[\"jarvis\", \"jarbas\", \"jarves\", \"javis\", \"jarvas\", \"[unk]\"]";

              final Handler h = new Handler(Looper.getMainLooper());
              Model model;
              EarLoop ear;
              boolean paused = false;
              long lastTrigger = 0;
              static volatile long lastListenAt = 0;
              BgBrain brain;
              final Runnable resumeRunnable = this::resume;

              static void pauseAll() {
                  WakeService s = inst;
                  if (s != null) s.h.post(s::pause);
              }

              /** Chamar só na thread principal. */
              /** true se a escuta do nome esta com o microfone agora. */
              static boolean micHeld() {
                  WakeService s = inst;
                  return s != null && s.ear != null;
              }

              static void pauseNow() {
                  WakeService s = inst;
                  if (s != null) s.pause();
              }

              static void resumeAll() {
                  WakeService s = inst;
                  if (s != null) {
                      s.h.removeCallbacks(s.resumeRunnable);
                      s.h.postDelayed(s.resumeRunnable, 2200);
                  }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  inst = this;
                  running = true;
                  try { LibVosk.setLogLevel(LogLevel.WARNINGS); } catch (Throwable ignored) { }
                  try { brain = new BgBrain(this); } catch (Throwable t) { brain = null; }
                  try { EarLoop.clapOn = getSharedPreferences("jvprefs", MODE_PRIVATE).getBoolean("clapOn", false); } catch (Throwable t) { }
              }

              static void cancelBgListen() {
                  WakeService s = inst;
                  if (s != null && s.brain != null) {
                      try { s.brain.cancelListen(); } catch (Throwable t) { }
                  }
              }

              /** Roda um comando marcado para um horario (ex.: resumo do dia). */
              static void runCommand(final String cmd) {
                  MainActivity a = MainActivity.current;
                  if (a != null) {
                      a.js("jvNative.onCommand(" + JSONObject.quote(cmd) + ")");
                      return;
                  }
                  final WakeService s = inst;
                  if (s == null || s.brain == null) return;
                  s.h.post(new Runnable() { public void run() { if (s.brain != null) s.brain.command(cmd); } });
              }

              /** Fala um aviso (lembrete) quando o app esta fechado. */
              static void announce(final String text) {
                  final WakeService s = inst;
                  if (s == null || s.brain == null || MainActivity.current != null) return;
                  s.h.post(new Runnable() { public void run() { if (s.brain != null) s.brain.announce(text); } });
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("wake", "Escuta do Jarvis", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent open = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "wake")
                          .setContentTitle("J.A.R.V.I.S. em espera")
                          .setContentText("Diga \"Jarvis\" para me chamar (detector offline)")
                          .setSmallIcon(R.drawable.ic_jarvis)
                          .setContentIntent(open)
                          .setOngoing(true)
                          .build();
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                      } else {
                          startForeground(1, n);
                      }
                  } catch (Exception e) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (model == null) loadModel();
                  else if (ear == null && !paused) startListening();
                  return START_STICKY;
              }

              void loadModel() {
                  StorageService.unpack(this, "model-pt", "model",
                          m -> {
                              model = m;
                              if (!paused) startListening();
                          },
                          e -> toast("Não consegui carregar o detector de voz offline."));
              }

              void startListening() {
                  if (model == null || paused || ear != null) return;
                  try {
                      Recognizer rec = new Recognizer(model, 16000.0f, GRAMMAR);
                      ear = new EarLoop(this, rec);
                      ear.start();
                  } catch (Throwable e) {
                      ear = null;
                      h.postDelayed(this::startListening, 3000);
                  }
              }

              /** O microfone falhou dentro do laco de escuta: tenta de novo. */
              void earFailed(EarLoop who) {
                  if (ear != who) return;
                  ear = null;
                  if (!paused) startListening();
              }

              /** Duas palmas: ativa igual a falar "Jarvis". */
              void clapWake() {
                  if (paused) return;
                  long now = System.currentTimeMillis();
                  if (now - lastListenAt < 5000) return;      // acabou de ouvir: som do proprio app nao conta como palma
                  if (now - lastTrigger < 3000) return;
                  lastTrigger = now;
                  trigger("__WAKE__");
              }

              static void setClap(android.content.Context c, boolean on) {
                  EarLoop.clapOn = on;
                  c.getSharedPreferences("jvprefs", MODE_PRIVATE).edit().putBoolean("clapOn", on).apply();
              }

              void stopListening() {
                  if (ear != null) {
                      try { ear.quit(); } catch (Exception ignored) { }
                      ear = null;
                  }
              }

              void pause() {
                  paused = true;
                  h.removeCallbacks(resumeRunnable);
                  stopListening();
              }

              void resume() {
                  if (!paused) return;
                  paused = false;
                  startListening();
              }

              /* ---------- RecognitionListener (Vosk) ---------- */
              @Override
              public void onPartialResult(String hypothesis) {
                  check(hypothesis, "partial");
              }

              @Override
              public void onResult(String hypothesis) {
                  check(hypothesis, "text");
              }

              @Override
              public void onFinalResult(String hypothesis) {
                  check(hypothesis, "text");
              }

              @Override
              public void onError(Exception e) {
                  stopListening();
                  if (!paused) h.postDelayed(this::startListening, 2000);
              }

              @Override
              public void onTimeout() {
                  stopListening();
                  if (!paused) h.postDelayed(this::startListening, 500);
              }

              void check(String json, String field) {
                  if (json == null || paused) return;
                  String t;
                  try {
                      t = new JSONObject(json).optString(field, "");
                  } catch (Exception e) {
                      return;
                  }
                  t = t.toLowerCase();
                  if (t.isEmpty()) return;
                  if (t.contains("jarvis") || t.contains("jarbas") || t.contains("jarves") || t.contains("javis") || t.contains("jarvas")) {
                      long now = System.currentTimeMillis();
                      if (now - lastTrigger < 3000) return;
                      lastTrigger = now;
                      h.post(() -> trigger("__WAKE__"));
                  }
              }

              void trigger(String cmd) {
                  // se o app ja esta ouvindo o usuario, nao comeca outra escuta por cima (isso gerava "servico ocupado")
                  MainActivity busyAct = MainActivity.current;
                  if (busyAct != null && (busyAct.listenPending || busyAct.nativeListening)
                          && System.currentTimeMillis() - busyAct.listenStartedAt < 15000) return;
                  pause();
                  boolean onScreen = MainActivity.current != null && MainActivity.current.hasWindowFocus();
                  if (!onScreen && brain != null) {
                      // Fora do app: responde so por voz, daqui mesmo, sem abrir nenhuma tela.
                      try {
                          brain.wake();
                          return;
                      } catch (Throwable t) { }
                  }
                  boolean ghost = getSharedPreferences("jvprefs", MODE_PRIVATE).getBoolean("voiceGhost", true);
                  Intent i = new Intent(this, MainActivity.class);
                  i.putExtra("cmd", cmd);
                  i.putExtra("mini", !ghost);
                  i.putExtra("ghost", ghost);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  boolean visible = MainActivity.current != null && MainActivity.current.hasWindowFocus();
                  try {
                      startActivity(i);
                  } catch (Exception ignored) { }
                  if (!visible && !Settings.canDrawOverlays(this)) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("call", "Chamadas do Jarvis", NotificationManager.IMPORTANCE_HIGH));
                      PendingIntent pi = PendingIntent.getActivity(this, 2, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification n = new Notification.Builder(this, "call")
                              .setContentTitle("J.A.R.V.I.S.")
                              .setContentText("Pois não? Toque para falar.")
                              .setSmallIcon(R.drawable.ic_jarvis)
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .build();
                      nm.notify(2, n);
                  }
                  // Segurança: volta a esperar o nome mesmo se ninguém responder.
                  h.removeCallbacks(resumeRunnable);
                  h.postDelayed(resumeRunnable, 20000);
              }

              void toast(String msg) {
                  MainActivity a = MainActivity.current;
                  if (a != null) a.js("jvNative.onToast(" + JSONObject.quote(msg) + ")");
              }

              @Override
              public void onDestroy() {
                  running = false;
                  paused = true;
                  stopListening();
                  h.removeCallbacksAndMessages(null);
                  if (brain != null) {
                      try { brain.destroy(); } catch (Throwable t) { }
                      brain = null;
                  }
                  if (model != null) {
                      try { model.close(); } catch (Exception ignored) { }
                      model = null;
                  }
                  if (inst == this) inst = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          JARVIS_EOF
          echo '' | base64 -d > app/jarvis.keystore

      - name: Baixar o detector de voz offline (Vosk, português)
        run: |
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q model.zip -d model_tmp
          DIR=$(find model_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$DIR" jarvis/app/src/main/assets/model-pt
          date +%s > jarvis/app/src/main/assets/model-pt/uuid
          echo "Palavras parecidas com Jarvis que o modelo conhece:"
          WORDS=$(find jarvis/app/src/main/assets/model-pt -name words.txt | head -n 1)
          for w in jarvis jarbas jarves javis jarvas; do
            if [ -n "$WORDS" ] && grep -q "^$w " "$WORDS"; then echo "  $w: sim"; else echo "  $w: nao"; fi
          done
          du -sh jarvis/app/src/main/assets/model-pt

      - name: Montar o APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp jarvis/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Jarvis App v${{ github.run_number }}
          body: "Versão 1.8: alarmes e timer no relógio do celular (tocam com o app fechado) e eventos na agenda. Baixe o Jarvis.apk abaixo e instale por cima."
          files: Jarvis.apk
          make_latest: true
