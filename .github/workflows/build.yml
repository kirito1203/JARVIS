                      switch (action == null ? "" : action) {
                          case "play": code = KeyEvent.KEYCODE_MEDIA_PLAY; break;
                          case "pause": code = KeyEvent.KEYCODE_MEDIA_PAUSE; break;
                          case "next": code = KeyEvent.KEYCODE_MEDIA_NEXT; break;
                          case "previous": code = KeyEvent.KEYCODE_MEDIA_PREVIOUS; break;
                          case "stop": code = KeyEvent.KEYCODE_MEDIA_STOP; break;
                          default: code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                      }
                      try {
                          MediaController mc = activeController();
                          if (mc != null) {
                              MediaController.TransportControls tc = mc.getTransportControls();
                              switch (code) {
                                  case KeyEvent.KEYCODE_MEDIA_PLAY: tc.play(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_PAUSE: tc.pause(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_NEXT: tc.skipToNext(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_PREVIOUS: tc.skipToPrevious(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_STOP: tc.stop(); return "ok";
                                  default: break;
                              }
                          }
                          AudioManager am = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                          return "ok";
                      } catch (Exception e) {
                          return "erro";
                      }
                  }

