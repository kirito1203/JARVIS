               */
              static List<ComponentName> recognizers(Context c) {
                  List<ComponentName> out = new ArrayList<>();
                  try {
                      String good = c.getSharedPreferences("jvprefs", Context.MODE_PRIVATE).getString("recGood", "");
                      Intent q = new Intent(RecognitionService.SERVICE_INTERFACE);
                      List<ResolveInfo> l = c.getPackageManager().queryIntentServices(q, 0);
                      if (l != null) {
                          for (int pass = -1; pass < 4; pass++) {
                              for (ResolveInfo ri : l) {
                                  if (ri.serviceInfo == null) continue;
                                  String p = ri.serviceInfo.packageName;
                                  if (p.equals(c.getPackageName())) continue;
                                  ComponentName cn = new ComponentName(p, ri.serviceInfo.name);
                                  int rank;
                                  if (!good.isEmpty() && good.equals(cn.flattenToString())) rank = -1;
                                  else if (p.equals("com.google.android.tts")) rank = 0;
                                  else if (p.equals("com.google.android.googlequicksearchbox")) rank = 2;
                                  else if (p.contains("google")) rank = 1;
                                  else rank = 3;
                                  if (rank == pass) out.add(cn);
                              }
                          }
                      }
                  } catch (Exception ignored) { }
                  return out;
              }

