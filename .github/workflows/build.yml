          package com.kirito.jarvis;

          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;

          import org.vosk.Recognizer;

          /**
           * Le o microfone e faz duas coisas ao mesmo tempo, tudo offline:
           * 1) entrega o som para o Vosk achar a palavra "Jarvis";
           * 2) procura DUAS PALMAS seguidas (se o modo palmas estiver ligado).
           */
          class EarLoop extends Thread {

              static volatile boolean clapOn = false;

              final WakeService svc;
              final Recognizer rec;
              volatile boolean alive = true;

              // detector de palmas (quadros de 20 ms)
              double floor = 300;
              boolean inBurst = false;
              int burstFrames = 0;
              long burstStart = 0;
              long firstClap = 0;
              long frameNo = 0;

              EarLoop(WakeService s, Recognizer r) {
                  super("jarvis-ear");
                  svc = s;
                  rec = r;
              }

              void quit() {
                  alive = false;
                  try { join(350); } catch (Exception ignored) { }
              }

              @Override
              public void run() {
                  AudioRecord ar = null;
                  boolean failed = false;
                  try {
                      final int sr = 16000;
                      int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      int size = Math.max(min, 6400) * 2;
                      ar = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, sr,
                              AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, size);
                      if (ar.getState() != AudioRecord.STATE_INITIALIZED) throw new IllegalStateException("mic");
                      ar.startRecording();
                      short[] buf = new short[320];
                      int sincePartial = 0;
                      while (alive) {
                          int n = ar.read(buf, 0, buf.length);
                          if (n < 0) { failed = true; break; }
                          if (n == 0) continue;
                          frameNo++;
                          if (clapOn) clap(buf, n);
                          if (rec.acceptWaveForm(buf, n)) {
                              post(rec.getResult(), "text");
                              sincePartial = 0;
                          } else if (++sincePartial >= 8) {
                              sincePartial = 0;
                              post(rec.getPartialResult(), "partial");
                          }
                      }
                  } catch (Throwable t) {
                      failed = true;
                  } finally {
                      if (ar != null) {
                          try { ar.stop(); } catch (Exception ignored) { }
                          try { ar.release(); } catch (Exception ignored) { }
                      }
                      try { rec.close(); } catch (Throwable ignored) { }
                  }
                  if (failed && alive) {
                      final EarLoop me = this;
                      svc.h.postDelayed(new Runnable() { public void run() { svc.earFailed(me); } }, 2500);
                  }
              }

              void post(final String json, final String field) {
                  if (json == null || json.indexOf("ja") < 0) return;   // so interessa se tiver algo parecido com "jarvis"
                  svc.h.post(new Runnable() { public void run() { svc.check(json, field); } });
              }

              /** Palma = estalo forte e curtinho. Duas palmas com 0,2 a 0,8 s entre elas ativam o Jarvis. */
              void clap(short[] b, int n) {
                  long sum = 0;
                  int peak = 0;
                  for (int i = 0; i < n; i++) {
                      int v = b[i];
                      if (v < 0) v = -v;
                      if (v > peak) peak = v;
                      sum += (long) v * v;
                  }
                  double rms = Math.sqrt(sum / (double) n);
                  long now = frameNo * 20L;
                  if (!inBurst) {
                      if (peak > 9000 && rms > Math.max(1500.0, floor * 6.0)) {
                          inBurst = true;
                          burstFrames = 1;
                          burstStart = now;
                      } else {
