          cat > app/src/main/java/com/kirito/jarvis/JarvisWidget.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          /** Widget do reator: tocou, o Jarvis abre e já começa a ouvir. */
          public class JarvisWidget extends AppWidgetProvider {

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  Intent i = new Intent(ctx, MainActivity.class);
                  i.putExtra("cmd", "__WAKE__");
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(ctx, 10, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_jarvis);
                      v.setOnClickPendingIntent(R.id.widget_root, pi);
                      mgr.updateAppWidget(id, v);
                  }
              }
          }
          JARVIS_EOF
          cat > app/src/main/java/com/kirito/jarvis/MainActivity.java <<'JARVIS_EOF'
          package com.kirito.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
