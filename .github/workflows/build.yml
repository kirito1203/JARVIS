                  @JavascriptInterface
                  public void vibrate(String pattern) {
                      try {
                          String[] p = pattern.split(",");
                          long[] arr = new long[p.length + 1];
                          arr[0] = 0;
                          for (int i = 0; i < p.length; i++) arr[i + 1] = Long.parseLong(p[i].trim());
                          Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                          if (v != null) v.vibrate(VibrationEffect.createWaveform(arr, -1));
                      } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void setAlarm(String id, double due, String text) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                          PendingIntent pi = AlarmReceiver.pending(MainActivity.this, id, text, false);
                          long when = (long) due;
                          try {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pi);
                          } catch (SecurityException se) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pi);
                          }
                      } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void cancelAlarm(String id) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                          PendingIntent pi = AlarmReceiver.pending(MainActivity.this, id, "", true);
                          if (pi != null) am.cancel(pi);
                      } catch (Exception ignored) { }
                  }

