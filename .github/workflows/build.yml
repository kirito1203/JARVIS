              /* ---------------- apps ---------------- */
              static String norm(String s) {
                  if (s == null) return "";
                  return Normalizer.normalize(s.toLowerCase(Locale.ROOT), Normalizer.Form.NFD)
                          .replaceAll("\\p{M}", "").replaceAll("[^a-z0-9 ]", " ").replaceAll("\\s+", " ").trim();
              }

              List<ResolveInfo> launchables() {
                  Intent m = new Intent(Intent.ACTION_MAIN);
                  m.addCategory(Intent.CATEGORY_LAUNCHER);
                  return getPackageManager().queryIntentActivities(m, 0);
              }

              String openAppByName(String name) {
                  String q = norm(name);
                  if (q.isEmpty()) return "";
                  PackageManager pm = getPackageManager();
                  ResolveInfo best = null;
                  int bestScore = 0;
                  for (ResolveInfo ri : launchables()) {
                      String label = norm(ri.loadLabel(pm).toString());
                      String pkg = ri.activityInfo.packageName.toLowerCase(Locale.ROOT);
                      int sc = 0;
                      if (label.equals(q)) sc = 4;
                      else if (label.startsWith(q) || q.startsWith(label)) sc = 3;
                      else if (label.length() > 2 && (label.contains(q) || q.contains(label))) sc = 2;
                      else if (pkg.contains(q.replace(" ", ""))) sc = 1;
                      if (sc > bestScore) {
                          best = ri;
                          bestScore = sc;
                      }
                  }
                  if (best == null) return "";
                  Intent launch = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
                  if (launch == null) return "";
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(launch);
                  return best.loadLabel(pm).toString();
              }

