              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
                  if (!pendingCommand.isEmpty()) {
                      String c = pendingCommand;
                      pendingCommand = "";
                      js("jvNative.onCommand(" + JSONObject.quote(c) + ")");
                  }
              }

              void handleIntent(Intent i) {
                  if (i == null) return;
                  String a = i.getAction();
                  boolean mini = i.getBooleanExtra("mini", false)
                          || Intent.ACTION_ASSIST.equals(a) || "android.intent.action.VOICE_COMMAND".equals(a);
                  if (mini || Intent.ACTION_MAIN.equals(a)) setMini(mini);
                  i.removeExtra("mini");
                  if (i.hasExtra("cmd")) {
                      String c = i.getStringExtra("cmd");
                      pendingCommand = c == null ? "" : c;
                      i.removeExtra("cmd");
                  } else if (Intent.ACTION_ASSIST.equals(a) || "android.intent.action.VOICE_COMMAND".equals(a)) {
                      pendingCommand = "__WAKE__";
                  }
              }

              void setMini(boolean on) {
                  miniMode = on;
                  js("jvNative.setMini&&jvNative.setMini(" + on + ")");
              }

              /** Usa o reconhecedor de voz do Google mesmo quando o Jarvis é o assistente padrão. */
              static SpeechRecognizer createRecognizer(Context c) {
                  try {
                      Intent q = new Intent(RecognitionService.SERVICE_INTERFACE);
                      List<ResolveInfo> l = c.getPackageManager().queryIntentServices(q, 0);
                      ComponentName best = null;
                      if (l != null) {
                          for (ResolveInfo ri : l) {
                              if (ri.serviceInfo == null) continue;
                              String p = ri.serviceInfo.packageName;
                              if (p.equals(c.getPackageName())) continue;
                              ComponentName cn = new ComponentName(p, ri.serviceInfo.name);
                              if (p.contains("google")) return SpeechRecognizer.createSpeechRecognizer(c, cn);
                              if (best == null) best = cn;
                          }
                      }
                      if (best != null) return SpeechRecognizer.createSpeechRecognizer(c, best);
                  } catch (Exception ignored) { }
                  return SpeechRecognizer.createSpeechRecognizer(c);
              }

              void js(String code) {
                  ui.post(() -> {
                      if (web != null) web.evaluateJavascript("try{" + code + "}catch(e){}", null);
                  });
              }

              void openExternal(String url) {
                  try {
                      Intent it;
                      if (url.startsWith("intent:")) {
                          it = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                      } else {
                          it = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      }
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(it);
                  } catch (Exception e) {
                      js("jvNative.onToast(" + JSONObject.quote("Não consegui abrir isso, senhor.") + ")");
                  }
              }

