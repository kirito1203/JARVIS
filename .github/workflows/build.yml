                  /* ---------- música ---------- */
                  @JavascriptInterface
                  public String media(String action) {
                      int code;
                      switch (action == null ? "" : action) {
                          case "play": code = KeyEvent.KEYCODE_MEDIA_PLAY; break;
                          case "pause": code = KeyEvent.KEYCODE_MEDIA_PAUSE; break;
                          case "next": code = KeyEvent.KEYCODE_MEDIA_NEXT; break;
                          case "previous": code = KeyEvent.KEYCODE_MEDIA_PREVIOUS; break;
                          case "stop": code = KeyEvent.KEYCODE_MEDIA_STOP; break;
                          default: code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                      }
                      try {
                          MediaController mc = activeController();
                          if (mc != null) {
                              MediaController.TransportControls tc = mc.getTransportControls();
                              switch (code) {
                                  case KeyEvent.KEYCODE_MEDIA_PLAY: tc.play(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_PAUSE: tc.pause(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_NEXT: tc.skipToNext(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_PREVIOUS: tc.skipToPrevious(); return "ok";
                                  case KeyEvent.KEYCODE_MEDIA_STOP: tc.stop(); return "ok";
                                  default: break;
                              }
                          }
                          AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                          return "ok";
                      } catch (Exception e) {
                          return "erro";
                      }
                  }

                  @JavascriptInterface
                  public String nowPlaying() {
                      try {
                          MediaController mc = activeController();
                          if (mc == null) return notifAccess() ? "{}" : "";
                          JSONObject o = new JSONObject();
                          MediaMetadata md = mc.getMetadata();
                          if (md != null) {
                              String t = md.getString(MediaMetadata.METADATA_KEY_TITLE);
                              String a = md.getString(MediaMetadata.METADATA_KEY_ARTIST);
                              o.put("musica", t == null ? "" : t);
                              o.put("artista", a == null ? "" : a);
                          }
                          PlaybackState ps = mc.getPlaybackState();
                          o.put("tocando", ps != null && ps.getState() == PlaybackState.STATE_PLAYING);
                          String app = mc.getPackageName();
                          try {
                              app = getPackageManager().getApplicationLabel(getPackageManager().getApplicationInfo(app, 0)).toString();
                          } catch (Exception ignored) { }
                          o.put("app", app);
                          return o.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public int volume(String action, int percent) {
                      try {
                          AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                          int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                          switch (action == null ? "" : action) {
                              case "up": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI); break;
                              case "down": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI); break;
                              case "mute": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI); break;
                              case "unmute": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, AudioManager.FLAG_SHOW_UI); break;
                              case "set":
                                  int p = Math.max(0, Math.min(100, percent));
                                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(max * p / 100f), AudioManager.FLAG_SHOW_UI);
                                  break;
                              default: break;
                          }
                          return Math.round(am.getStreamVolume(AudioManager.STREAM_MUSIC) * 100f / Math.max(1, max));
                      } catch (Exception e) {
                          return -1;
                      }
                  }
              }

              boolean notifAccess() {
                  try {
                      String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      return flat != null && flat.contains(getPackageName());
                  } catch (Exception e) {
                      return false;
                  }
              }

              MediaController activeController() {
                  if (!notifAccess()) return null;
                  try {
                      MediaSessionManager msm = (MediaSessionManager) getSystemService(MEDIA_SESSION_SERVICE);
                      List<MediaController> list = msm.getActiveSessions(new ComponentName(this, NotifService.class));
                      if (list == null || list.isEmpty()) return null;
                      for (MediaController mc : list) {
                          PlaybackState ps = mc.getPlaybackState();
                          if (ps != null && ps.getState() == PlaybackState.STATE_PLAYING) return mc;
                      }
                      return list.get(0);
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
