                              case "down": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0); break;
                              case "mute": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, 0); break;
                              case "unmute": am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0); break;
                              case "set":
                                  int p = Math.max(0, Math.min(100, percent));
                                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(max * p / 100f), 0);
                                  break;
                              default: break;
                          }
                          return Math.round(am.getStreamVolume(AudioManager.STREAM_MUSIC) * 100f / Math.max(1, max));
